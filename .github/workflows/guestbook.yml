name: Guestbook

# 访客通过 issue 留言，这里把 issue 列表重新渲染成 README 里的 log 表。
# 每条留言都来自 issue，删掉 issue 后重跑就会从列表里消失。
on:
  issues:
    types: [opened, edited, reopened, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 串行执行：两个访客同时留言时不要互相覆盖
concurrency:
  group: guestbook
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the visitor log and push it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 每次都从远端最新 README 重新生成，避免两次运行抢同一个提交
          for attempt in 1 2 3; do
            git fetch -q origin master
            git reset -q --hard origin/master
            python3 scripts/guestbook.py
            git add README.md

            if git diff --cached --quiet; then
              echo "log unchanged"
              exit 0
            fi

            git commit -q -m "chore(guestbook): refresh the visitor log"
            if git push -q origin master; then
              echo "log pushed"
              exit 0
            fi
            echo "push raced, retrying (attempt $attempt)"
            sleep 5
          done

          echo "could not push the guestbook update" >&2
          exit 1

      - name: Welcome the visitor
        if: github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$NUMBER" --body "Welcome aboard, @$LOGIN — you are in the visitor log on the profile README now. Closing this so the list stays tidy."
          gh issue close "$NUMBER"
