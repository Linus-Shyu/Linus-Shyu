name: Generate Assets

# 每天刷新 hero（repos/stars/followers）和两张图表（活动折线图 + 奖杯墙），
# 数字来自 GitHub API，有变化才提交。
on:
  schedule:
    # 跟在 snake 之后（snake 是 00:00）
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - name: Render hero and charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/make_hero.py
          python3 scripts/make_charts.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "assets unchanged"
          else
            git commit -m "chore(assets): refresh hero stats and charts"
            git push
          fi
