name: Generate Snake

on:
  schedule:
    # 每天 UTC 00:00 刷新一次，把最新的贡献格子喂给蛇
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23e0c3fc&color_dots=%231c1b22,%232e2540,%234c2f7a,%237a3fbf,%23a855f7

      # snk 不支持背景色参数，这里把一块黑色底板插到 SVG 最底层，
      # 这样不管 GitHub 是 light 还是 dark 主题，图都是黑底紫蛇。
      - name: Bake black background into the SVG
        run: |
          # snk 跑在容器里，产物属主是 root，改文件前先拿回来
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 - <<'PY'
          import pathlib, re

          bg_color = "#0b0b10"

          for path in pathlib.Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")
              box = re.search(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)"', svg)
              x, y, w, h = box.groups()
              plate = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" fill="{bg_color}"/>'
              if plate in svg:
                  continue
              svg = svg.replace(">", ">" + plate, 1)
              path.write_text(svg, encoding="utf-8")
              print(f"{path}: background added on viewBox {x} {y} {w} {h}")
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
