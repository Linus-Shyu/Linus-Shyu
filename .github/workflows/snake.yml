name: Generate Snake

on:
  schedule:
    # 每天 UTC 00:00 刷新一次，把最新的贡献格子喂给蛇
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      # README / 素材变化不影响贡献图，省一次运行
      - "README.md"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # dark + light 两版，README 里用 <picture> 按主题切换
          outputs: |
            dist/github-snake.svg?color_snake=%237ee787&color_dots=%23161b22,%231b3a26,%232f7d4a,%233fb950,%2356d364
            dist/github-snake-light.svg?color_snake=%2314532d&color_dots=%23eaf6ee,%23c9ebd5,%2387d3a4,%234aab6d,%231f7a45

      # snk 本身不支持背景色，这里做两步收尾：
      # 1. 去掉格子下方那条会生长的进度彩带（贴底色后像一条孤零零的色块）
      # 2. 把一块纯色底板插到 SVG 最底层，这样不管 GitHub 是 light 还是 dark
      #    主题，图和页面底色都是无缝的
      - name: Bake theme colours into the SVGs
        run: |
          # snk 跑在容器里，产物属主是 root，改文件前先拿回来
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 - <<'PY'
          import pathlib, re

          for path in pathlib.Path("dist").glob("*.svg"):
              # 文件名里带 light 的用白底，其余用 GitHub dark 的画布色，让图直接融进页面
              plate_color = "#ffffff" if "light" in path.stem else "#0d1117"

              svg = path.read_text(encoding="utf-8")
              svg, ribbon = re.subn(r'<rect class="u u[0-9a-z]+"[^>]*/>', "", svg)

              box = re.search(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)"', svg)
              x, y, w, h = box.groups()
              plate = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" fill="{plate_color}"/>'
              if plate not in svg:
                  svg = svg.replace(">", ">" + plate, 1)

              path.write_text(svg, encoding="utf-8")
              print(f"{path.name}: plate {plate_color}, removed {ribbon} ribbon rects")
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
