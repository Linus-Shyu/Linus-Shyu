<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Linus Shyu terminal">
  <defs>
    <linearGradient id="nf-dark-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101310"/>
      <stop offset="100%" stop-color="#0a0c0a"/>
    </linearGradient>
    <radialGradient id="nf-dark-glow" cx="18%" cy="8%" r="80%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nf-dark-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="nf-dark-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.06"/>
    </pattern>
    <filter id="nf-dark-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="nf-dark-blur"><feGaussianBlur stdDeviation="3.2"/></filter>
    <style>
      .c{animation:nf-dark-blink 1.1s steps(1) infinite}
      @keyframes nf-dark-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    </style>
  </defs>

  <rect width="1000" height="380" rx="22" fill="url(#nf-dark-page)"/>

  <rect x="24" y="24" width="952" height="332" rx="14" fill="#0b0d0c" stroke="#1c211c" filter="url(#nf-dark-shadow)"/>
  <path d="M24 38 a14 14 0 0 1 14 -14 h924 a14 14 0 0 1 14 14 v18 h-952 Z" fill="#101210"/>
  <circle cx="46" cy="47" r="5" fill="#ff5f57"/><circle cx="64" cy="47" r="5" fill="#febc2e"/><circle cx="82" cy="47" r="5" fill="#28c840"/>
  <text x="120" y="52" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#4f6a58">linus — zsh — 90×26</text>

  <rect x="24" y="56" width="952" height="300" fill="url(#nf-dark-glow)"/>

