  <polyline points="58.5,134.5 273,134.5 273,147.5 58.5,147.5 58.5,160.5 273,160.5 273,173.5 58.5,173.5 58.5,186.5 143,186.5" fill="none" stroke="#39d353" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="143" cy="186.5" r="7.5" fill="#7ff0a8"/>
  <circle cx="145" cy="184.5" r="1.8" fill="#0b0d0c"/>
  <circle cx="145" cy="189.5" r="1.8" fill="#0b0d0c"/>

