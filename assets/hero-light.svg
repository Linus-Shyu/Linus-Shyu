<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Linus Shyu terminal">
  <defs>
    <linearGradient id="nf-light-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f4ef"/>
      <stop offset="100%" stop-color="#fbfcf9"/>
    </linearGradient>
    <radialGradient id="nf-light-glow" cx="18%" cy="8%" r="80%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nf-light-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </radialGradient>
    <pattern id="nf-light-scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.035"/>
    </pattern>
    <filter id="nf-light-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="nf-light-blur"><feGaussianBlur stdDeviation="3.2"/></filter>
    <style>
      .c{animation:nf-light-blink 1.1s steps(1) infinite}
      @keyframes nf-light-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    </style>
  </defs>

  <rect width="1000" height="380" rx="22" fill="url(#nf-light-page)"/>

  <rect x="24" y="24" width="952" height="332" rx="14" fill="#f7f9f4" stroke="#d7ded7" filter="url(#nf-light-shadow)"/>
  <path d="M24 38 a14 14 0 0 1 14 -14 h924 a14 14 0 0 1 14 14 v18 h-952 Z" fill="#ecefea"/>
  <circle cx="46" cy="47" r="5" fill="#ff5f57"/><circle cx="64" cy="47" r="5" fill="#febc2e"/><circle cx="82" cy="47" r="5" fill="#28c840"/>
  <text x="120" y="52" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#758a7a">linus — zsh — 90×26</text>

  <rect x="24" y="56" width="952" height="300" fill="url(#nf-light-glow)"/>

  <!-- snake logo (neofetch art) -->
  <polyline points="58.5,134.5 273,134.5 273,147.5 58.5,147.5 58.5,160.5 273,160.5 273,173.5 58.5,173.5 58.5,186.5 143,186.5" fill="none" stroke="#0c7a43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="143" cy="186.5" r="7.5" fill="#12a05a"/>
  <circle cx="145" cy="184.5" r="1.8" fill="#0b0d0c"/>
  <circle cx="145" cy="189.5" r="1.8" fill="#0b0d0c"/>

  <!-- info column -->
  <text x="316" y="120" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="700" fill="#0c7a43" filter="url(#nf-light-blur)" opacity="0.55">linus@linus</text>
  <text x="316" y="120" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="700" fill="#0c7a43">linus@linus</text>
  <text x="316" y="138" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#758a7a">──────────────────────────────────────</text>

  <text x="316" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">name     </text>
  <text x="402" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#23281f">Linus Shyu</text>

  <text x="316" y="190" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">company  </text>
  <text x="402" y="190" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#23281f">Young Agent Lab</text>

  <text x="316" y="212" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">location </text>
  <text x="402" y="212" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#23281f">Kowloon City District, Hong Kong</text>

  <text x="316" y="234" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">website  </text>
  <text x="402" y="234" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#b45309">linusshyu.dev</text>

  <text x="316" y="256" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">langs    </text>
  <text x="402" y="256" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#23281f">Swift · Rust · TypeScript · Python · Solidity</text>

  <text x="316" y="278" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">focus    </text>
  <text x="402" y="278" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#23281f">macOS apps · autonomous agents · on-chain tools</text>

  <text x="316" y="300" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#0f7c48">contact  </text>
  <text x="402" y="300" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#23281f">@Linus_Shyu</text>

  <!-- prompt -->
  <text x="48" y="332" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#0c7a43">➜</text>
  <text x="70" y="332" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#23281f">~</text>
  <text x="92" y="332" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#758a7a">$</text>
  <rect class="c" x="112" y="320" width="9" height="15" fill="#0c7a43"/>

  <rect x="24" y="24" width="952" height="332" rx="14" fill="url(#nf-light-scan)"/>
  <rect width="1000" height="380" rx="22" fill="url(#nf-light-vignette)"/>
</svg>
